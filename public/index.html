<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 25 Coach</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #eee; font: 15px/1.3 ui-monospace, Menlo, monospace; }
  body { padding: 12px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
  a { color: #888; }
  .hdr { display: flex; align-items: center; gap: 16px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: 0.1em; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #666; margin-right: 6px; }
  .live .dot { background: #2ecc40; } .waiting .dot { background: #f39c12; } .disconnected .dot { background: #e74c3c; }
  button { background: #1a1a1a; color: #eee; border: 1px solid #444; padding: 3px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  button.on { border-color: #2ecc40; color: #2ecc40; }
  .label { font-size: 11px; color: #888; letter-spacing: 0.15em; }
  .top { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: start; }
  .huge { font-size: 96px; line-height: 1; font-weight: bold; letter-spacing: -0.03em; }
  .huge.flat { color: #555; } .loss { color: #e74c3c; } .gain { color: #2ecc40; }
  .big { font-size: 52px; line-height: 1.05; font-weight: bold; }
  .big small { font-size: 22px; color: #aaa; font-weight: normal; }
  .next { font-size: 30px; line-height: 1.1; color: #aaa; }
  .next b { color: #eee; font-size: 42px; }
  .next .brake { color: #eee; font-size: 56px; font-weight: bold; }
  .next .zone { color: #e74c3c; font-size: 56px; font-weight: bold; }
  .next .flat { color: #2ecc40; font-size: 56px; font-weight: bold; }
  .plan { font-size: 22px; color: #aaa; margin-top: 4px; white-space: nowrap; }
  .plan b { font-size: 28px; }
  .plan .r { color: #ff3b30; } .plan .w { color: #eee; } .plan .g { color: #2ecc40; } .plan .y { color: #f1c40f; }
  .main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(380px, 1fr); gap: 20px; flex: 1; min-height: 0; }
  .main > div { min-height: 0; }
  #live-right, #report { display: flex; flex-direction: column; gap: 10px; }
  #report { display: none; }
  body.report #report { display: flex; }
  .card { margin-bottom: 0; }
  .card.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .card.grow canvas.fill { flex: 1; min-height: 110px; height: auto !important; }
  .check { display: grid; grid-template-columns: 24px 70px 1fr 1fr; gap: 2px 10px; font-size: 18px; margin-top: 6px; align-items: baseline; max-width: 360px; }
  .check .h { font-size: 11px; color: #888; letter-spacing: 0.15em; }
  .check .ok { color: #2ecc40; } .check .bad { color: #e74c3c; } .check .k { color: #aaa; font-size: 14px; } .check .v { color: #eee; font-weight: bold; } .check .b { color: #888; }
  canvas { display: block; width: 100%; }
  .left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #map { background: #0a0a0a; border: 1px solid #333; flex: 1; min-height: 0; cursor: pointer; }
  .card.corner { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.2fr); gap: 0 16px; align-items: start; flex: none; }
  .card { border: 1px solid #2a2a2a; border-radius: 8px; padding: 10px 14px; background: #0d0d0d; margin-bottom: 10px; }
  .verdict { font-size: 34px; font-weight: bold; line-height: 1.1; }
  .tip { font-size: 18px; color: #ddd; margin-top: 4px; }
  .lesson { font-size: 22px; line-height: 1.25; }
  .lesson .t { color: #f1c40f; font-weight: bold; }
  .better { color: #2ecc40; } .worse { color: #e74c3c; } .same { color: #aaa; }
  .sub { color: #888; font-size: 13px; }
  body.report #live-right { display: none; }
  .report-line { font-size: 22px; white-space: nowrap; }
  #report { overflow-y: auto; }
  .laps { max-height: 150px; overflow-y: auto; font-size: 14px; margin-top: 4px; }
  .laps div { display: grid; grid-template-columns: 36px 60px 110px 80px 1fr; gap: 10px; padding: 2px 4px; cursor: pointer; border-radius: 4px; }
  .laps .i { color: #666; text-align: right; }
  .laps div:hover { background: #1a1a1a; } .laps div.sel { background: #22301f; }
  .laps .n { color: #888; } .laps .t { font-weight: bold; } .laps .when { color: #666; font-size: 12px; }
  .report-line b { font-size: 30px; }
</style>
</head>
<body>
<div class="hdr">
  <h1>F1 25 COACH</h1>
  <span id="status" class="disconnected"><span class="dot"></span><span id="status-text">DISCONNECTED</span></span>
  <span id="track-name" class="sub"></span>
  <span id="ref-note" class="sub"></span>
  <span style="flex:1"></span>
  <button id="mode-btn">LAP REPORT</button>
  <a href="/live" style="font-size:12px">full telemetry →</a>
  <a href="/compare" style="font-size:12px">compare →</a>
  <a href="/setups" style="font-size:12px">setups →</a>
</div>

<div class="top">
  <div><div class="huge flat" id="gap">--</div></div>
  <div><div class="big"><span id="mph">0</span> <small>mph</small> &nbsp; <span id="gear">N</span></div></div>

    <div class="next" id="next">--</div>
    <div class="plan" id="plan"></div>
  </div>
</div>

<div class="main">
  <div class="left">
    <canvas id="map"></canvas>
    <div class="card corner">
      <div>
        <div class="label">LAST CORNER · <span id="last-title">—</span></div>
        <div class="verdict" id="last-verdict">—</div>
        <div class="tip" id="last-tip"></div>
        <div class="check" id="last-check"></div>
      </div>
      <div>
        <canvas id="strips" width="520" height="210" style="height:210px;background:#0a0a0a;border:1px solid #222"></canvas>
      </div>
    </div>
  </div>

  <div id="live-right">
    <div class="card">
      <div class="label">WORK ON THIS</div>

    </div>
  </div>

  <div id="report">
    <div class="card">
      <div class="label">LAP REPORT · <span id="report-which" class="sub"></span> <button id="save-report" style="margin-left:10px">SAVE REPORT</button> <span id="save-note" class="sub"></span></div>
      <div class="report-line" id="report-line">—</div>
    </div>
    <div class="card">
      <div class="label">LAPS · <span id="laps-count"></span> · <button id="list-2s" class="on">WITHIN 2 s</button> <button id="list-session">THIS SESSION</button></div>
      <div id="laps-list" class="laps"></div>
    </div>
    <div class="card">
      <div class="label">TIME LOST PER CORNER</div>
      <canvas id="corner-bars" width="480" height="240" style="height:240px"></canvas>
    </div>
    <div class="card">
      <div class="label">WORK ON THIS</div>
      <div class="lesson" id="lesson-r">—</div>
      <canvas id="lesson-bar-r" width="480" height="66" style="height:66px;margin-top:6px;display:none"></canvas>
    </div>
  </div>
</div>

<script type="module">
  import { cornerSegments, cornerEntries, cornerMetrics, brakeEvents, coachBraking, progress, pickLesson, metricValue, sessionLesson, hasLine, fitWorld, applyFit, lineOffsets, turnSign, lineMetrics, coachLine, at } from "/analysis.js";

  const $ = (id) => document.getElementById(id);
  const MPH = 0.621371;
  const fmtLap = (ms) => { if (!ms) return "--"; const m = Math.floor(ms / 60000), s = ((ms % 60000) / 1000).toFixed(3).padStart(6, "0"); return `${m}:${s}`; };
  // your rule: purple at −0.10 or better, green for any gain, yellow for any loss up to +0.10, red beyond
  const resultColor = (dTime) => (dTime <= -100 ? "#b57bee" : dTime < 0 ? "#2ecc40" : dTime <= 100 ? "#f1c40f" : "#e74c3c");

  // ---- state ----
  let session = null, lapInfo = null, lastTelemetry = null, laps = [], player = 0, lastPacketAt = 0, socket = null;
  let trackRaw = null, track = null;
  let refLap = null, refSegs = [], refCorners = [], refEvents = [], refEntries = [];
  // Brake distance the way the boards count it: to where the corner starts bending. If the brake
  // point is already inside the bend (linked corners), count to the apex and say so.
  function brakeDist(ev) { return ev && ev.braking ? { m: ev.apexD - ev.brakeStartD, to: "apex" } : null; }
  let live = fresh(-1), history = {}, lesson = null, lastLap = null;
  let manualReport = false, inReport = false, pinned = null, seqFor = null, nextIdx = -1;
  let reportLap = null, lapList = [], reportCache = {}, listMode = "2s", allLaps = []; // a past lap chosen in the report; the laps list and its filter
  let sessionL = null, sessionLapsLoaded = 0; // the session lesson: computed over every recorded lap of this session within 2 s
  // Racing line: the quickest recorded lap that carries car positions is the line reference; its
  // positions fit the game's world onto the outline (worldFit) for every lap after it.
  let lastPos = null, lineRef = null, worldFit = null, lineRefOff = null, lineRefM = [], turnSigns = [];
  const shownLap = () => reportLap || lastLap;
  const refCache = {};
  function fresh(lapNum) { return { lapNum, armed: false, beforeLine: false, samples: [], log: [], attempts: [], cur: null, exited: false, gasM: 0 }; }

  // ---- data ----
  let geo = null; // rotated outline in track units: pts, cum, total
  async function loadTrack(id) {
    const r = await fetch(`/tracks/${id}.json`);
    trackRaw = r.ok ? await r.json() : null;
    if (trackRaw) { buildGeo(); fitTrack(); buildCoach(); }
  }
  function buildGeo() {
    const raw = trackRaw, rad = (raw.rotation || 0) * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
    const pts = raw.x.map((x, i) => [x * cos - raw.y[i] * sin, -(x * sin + raw.y[i] * cos)]);
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const total = cum[cum.length - 1] + Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]);
    geo = { pts, cum, total };
  }
  // point on the rotated outline at lap fraction f
  function geoAt(f) {
    const d = ((f % 1) + 1) % 1 * geo.total;
    let lo = 0, hi = geo.cum.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (geo.cum[mid] <= d) lo = mid; else hi = mid - 1; }
    const a = geo.pts[lo], b = geo.pts[(lo + 1) % geo.pts.length];
    const segLen = (lo + 1 < geo.cum.length ? geo.cum[lo + 1] : geo.total) - geo.cum[lo];
    const t = segLen > 0 ? (d - geo.cum[lo]) / segLen : 0;
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }
  async function loadReference(id) {
    const r = await fetch(`/api/reference?track=${id}&validOnly=0`);
    if (!r.ok) { refLap = null; $("ref-note").textContent = "no best lap yet"; return; }
    const best = await r.json();
    if (refLap && refLap.file === best.file) return;
    if (refLap) { live = fresh(live.lapNum); history = {}; lesson = null; renderLesson(); }
    refLap = refCache[best.file] ??= { ...(await (await fetch(`/api/lap?f=${encodeURIComponent(best.file)}`)).json()), file: best.file };
    $("ref-note").textContent = `best ${fmtLap(best.lapTimeMs)} · L${best.lapNum}`;
    buildCoach();
  }
  function buildCoach() {
    if (!refLap || !trackRaw) return;
    refSegs = cornerSegments(trackRaw, refLap.track.length);
    refCorners = refSegs.map((seg) => ({ seg, m: cornerMetrics(refLap.grid, seg) }));
    refEvents = refSegs.map((seg) => brakeEvents(refLap.grid, seg));
    refEntries = cornerEntries(trackRaw, refSegs, refLap.track.length);
    seqFor = null;
  }

  // ---- map: fitted with one uniform scale, canvas follows its box ----
  const canvas = $("map"), ctx = canvas.getContext("2d");
  new ResizeObserver(() => {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; if (trackRaw) fitTrack(); }
  }).observe(canvas);
  function fitTrack() {
    const raw = trackRaw, rad = (raw.rotation || 0) * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
    const rot = (x, y) => [x * cos - y * sin, -(x * sin + y * cos)];
    const pts = raw.x.map((x, i) => rot(x, raw.y[i]));
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const W = canvas.width, H = canvas.height, pad = Math.round(Math.min(W, H) * 0.08) + 30;
    const s = Math.min((W - 2 * pad) / (maxX - minX), (H - 2 * pad) / (maxY - minY));
    const ox = (W - (maxX - minX) * s) / 2, oy = (H - (maxY - minY) * s) / 2;
    const P = ([x, y]) => [ox + (x - minX) * s, oy + (y - minY) * s];
    const cpts = pts.map(P), cum = [0];
    for (let i = 1; i < cpts.length; i++) cum.push(cum[i - 1] + Math.hypot(cpts[i][0] - cpts[i - 1][0], cpts[i][1] - cpts[i - 1][1]));
    const total = cum[cum.length - 1] + Math.hypot(cpts[0][0] - cpts[cpts.length - 1][0], cpts[0][1] - cpts[cpts.length - 1][1]);
    track = { pts: cpts, cum, total, corners: raw.corners.map((c) => ({ n: c.n, p: P(rot(c.x, c.y)) })), scale: Math.max(1, W / 900), toCanvas: (X, Y) => P(rot(X, Y)) };
  }
  function pointAt(f) {
    const d = ((f % 1) + 1) % 1 * track.total;
    let lo = 0, hi = track.cum.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (track.cum[mid] <= d) lo = mid; else hi = mid - 1; }
    const a = track.pts[lo], b = track.pts[(lo + 1) % track.pts.length];
    const segLen = (lo + 1 < track.cum.length ? track.cum[lo + 1] : track.total) - track.cum[lo];
    const t = segLen > 0 ? (d - track.cum[lo]) / segLen : 0;
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }
  function drawMap() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (!track) { ctx.fillStyle = "#555"; ctx.font = "14px monospace"; ctx.fillText(session ? "no track outline" : "waiting for the game…", W / 2, H / 2); return; }
    const k = track.scale, L = session && session.trackLength;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 10 * k; ctx.beginPath();
    track.pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.stroke();
    // the lap being shown: live lap, or the finished lap in report mode
    const shown = inReport && shownLap() ? shownLap() : live;
    if (L && refLap) {
      ctx.lineWidth = 7 * k;
      const s = shown.samples;
      for (let i = 1; i < s.length; i++) {
        if (s[i].dt === null || s[i - 1].dt === null) continue;
        const a = pointAt(s[i - 1].d / L), b = pointAt(s[i].d / L), dd = s[i].dt - s[i - 1].dt;
        ctx.strokeStyle = Math.abs(dd) < 3 ? "#666" : dd > 0 ? "#e74c3c" : "#2ecc40";
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
      // brake pins: where your best lap starts braking for each corner. The next one pulses.
      const pulse = 1 + 0.25 * Math.sin(performance.now() / 150);
      refCorners.forEach((rc, i) => {
        if (!rc.m || rc.m.brakeD === null) return;
        const [x, y] = pointAt(rc.m.brakeD / L), isNext = i === nextIdx && !inReport, r = (isNext ? 12 * pulse : 7) * k;
        ctx.fillStyle = isNext ? "#ff3b30" : "#8a2a24";
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - r, y - r * 1.6); ctx.arc(x, y - r * 1.6, r, Math.PI, 0); ctx.lineTo(x, y); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y - r * 1.6, r * 0.4, 0, Math.PI * 2); ctx.fill();
        const bd = brakeDist(refEvents[i]), metres = bd ? Math.round(bd.m) + " m" : "";
        ctx.font = `bold ${Math.round((isNext ? 18 : 13) * k)}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.lineWidth = 4 * k; ctx.strokeStyle = "#0a0a0a"; ctx.strokeText(metres, x, y - r * 2.8); ctx.fillStyle = isNext ? "#ff3b30" : "#c0392b"; ctx.fillText(metres, x, y - r * 2.8);
        ctx.textBaseline = "middle";
      });
      // corner entry (small grey tick), trail (yellow along the road), apex (white tick + speed), gas (green dot + metres)
      refEvents.forEach((ev, i) => {
        if (!ev) return;
        const isNext = i === nextIdx && !inReport;
        if (ev.braking && ev.overlapM > 3) {
          ctx.strokeStyle = isNext ? "#f1c40f" : "#8a7a1a"; ctx.lineWidth = 5 * k; ctx.beginPath();
          for (let d = ev.apexD - ev.overlapM, first = true; d <= ev.apexD; d += 4, first = false) { const [px, py] = pointAt(d / L); first ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
          ctx.stroke();
        }
        const [ax, ay] = pointAt(ev.apexD / L), [bx, by] = pointAt((ev.apexD + 6) / L);
        const nx = -(by - ay), ny = bx - ax, nl = Math.hypot(nx, ny) || 1, t = 9 * k;
        ctx.strokeStyle = isNext ? "#fff" : "#999"; ctx.lineWidth = 3 * k;
        ctx.beginPath(); ctx.moveTo(ax - nx / nl * t, ay - ny / nl * t); ctx.lineTo(ax + nx / nl * t, ay + ny / nl * t); ctx.stroke();
        // apex speed, offset to the outside of the apex bar
        const sp = Math.round(ev.minSpeed * MPH) + " mph";
        ctx.font = `bold ${Math.round((isNext ? 16 : 12) * k)}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.lineWidth = 4 * k; ctx.strokeStyle = "#0a0a0a"; ctx.strokeText(sp, ax + nx / nl * t * 3.2, ay + ny / nl * t * 3.2);
        ctx.fillStyle = isNext ? "#fff" : "#aaa"; ctx.fillText(sp, ax + nx / nl * t * 3.2, ay + ny / nl * t * 3.2);
        if (ev.pickupD !== null && ev.apexToPickup > 3) {
          const [gx, gy] = pointAt(ev.pickupD / L), [hx, hy] = pointAt((ev.pickupD + 6) / L);
          const gnx = -(hy - gy), gny = hx - gx, gl = Math.hypot(gnx, gny) || 1;
          ctx.fillStyle = isNext ? "#2ecc40" : "#1f7a2e"; ctx.beginPath(); ctx.arc(gx, gy, (isNext ? 8 : 6) * k, 0, Math.PI * 2); ctx.fill();
          const gs = "+" + Math.round(ev.apexToPickup) + " m";
          ctx.font = `bold ${Math.round((isNext ? 14 : 11) * k)}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.lineWidth = 4 * k; ctx.strokeStyle = "#0a0a0a"; ctx.strokeText(gs, gx - gnx / gl * 22 * k, gy - gny / gl * 22 * k);
          ctx.fillStyle = isNext ? "#2ecc40" : "#4a8a55"; ctx.fillText(gs, gx - gnx / gl * 22 * k, gy - gny / gl * 22 * k);
        }
      });
    }
    // racing lines: best line lap in grey, the shown lap in white
    if (worldFit) {
      const draw = (xs, zs, color, width) => {
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); let pen = false;
        for (let i = 0; i < xs.length; i++) { if (xs[i] === 0 && zs[i] === 0) { pen = false; continue; } const [px, py] = worldToMap(xs[i], zs[i]); pen ? ctx.lineTo(px, py) : ctx.moveTo(px, py); pen = true; }
        ctx.stroke();
      };
      if (lineRef) draw(lineRef.grid.x, lineRef.grid.z, "#8a8a8a", 1.5 * k);
      const s = shown.samples; if (s.length > 1) draw(s.map((q) => q.x), s.map((q) => q.z), "#fff", 1.8 * k);
    }
    const sf = track.pts[0]; ctx.fillStyle = "#eee"; ctx.fillRect(sf[0] - 2 * k, sf[1] - 9 * k, 4 * k, 18 * k);
    // corner labels: grey until done, then the delta under the number
    for (const c of track.corners) {
      const r = shown.log.find((e) => e.n === c.n), col = !r ? "#666" : resultColor(r.dTime), dy = -20 * k;
      ctx.font = `bold ${Math.round(28 * k)}px monospace`; ctx.lineWidth = 5 * k; ctx.strokeStyle = "#0a0a0a";
      ctx.strokeText("T" + c.n, c.p[0], c.p[1] + dy); ctx.fillStyle = pinned === c.n ? "#fff" : col; ctx.fillText("T" + c.n, c.p[0], c.p[1] + dy);
      if (r) { const d = (r.dTime > 0 ? "+" : "") + (r.dTime / 1000).toFixed(2); ctx.font = `bold ${Math.round(24 * k)}px monospace`; ctx.strokeText(d, c.p[0], c.p[1] + dy + 28 * k); ctx.fillText(d, c.p[0], c.p[1] + dy + 28 * k); }
    }
    if (!inReport && lapInfo && L) {
      const me = lapInfo.cars[player];
      if (me) { const [x, y] = pointAt(me.lapDistance / L); ctx.fillStyle = "#2ecc40"; ctx.beginPath(); ctx.arc(x, y, 9 * k, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  canvas.onclick = (e) => {

  async function loadLineRef() {
    if (!trackRaw || !refLap) return;
    const L = refLap.track.length;
    const cands = allLaps.filter((l) => l.track.id === session.trackId && !l.flags.includes("incomplete")).sort((a, b) => a.lapTimeMs - b.lapTimeMs).slice(0, 40);
    for (const l of cands) {
      if (lineRef && lineRef.file === l.file) return;
      const rec = reportCache[l.file] ??= { ...(await (await fetch(`/api/lap?f=${encodeURIComponent(l.file)}`)).json()), file: l.file };
      if (!hasLine(rec.grid)) continue;
      const fit = fitWorld(rec.grid, trackRaw, L);
      if (!fit) continue;
      lineRef = rec; worldFit = fit;
      lineRefOff = lineOffsets(rec.grid, trackRaw, L, fit);
      turnSigns = refSegs.map((seg) => turnSign(trackRaw, L, seg.apexD));
      lineRefM = refSegs.map((seg, i) => lineMetrics(rec.grid, lineRefOff, brakeEvents(rec.grid, seg), turnSigns[i]));
      $("ref-note").textContent += ` · line L${rec.lapNum}`;
      return;
    }
  }
  // line metrics for any trace with d, x, z (a grid or a live slice)
  function lineOf(tr, ev, i) {
    if (!worldFit || !ev || !tr.x || !tr.x.some((v) => v !== 0)) return null;
    return lineMetrics(tr, lineOffsets(tr, trackRaw, refLap.track.length, worldFit), ev, turnSigns[i]);
  }
  // world position → the big map's canvas
  function worldToMap(x, z) { const [X, Y] = applyFit(worldFit, x, z); return track.toCanvas(X, Y); }
  // Every recorded lap of this session within 2 s of the best, judged corner by corner, then one
  // lesson for the session. Laps are fetched once and cached; recomputed when a lap completes.
  async function computeSessionLesson() {
    const uid = session.uid || (allLaps[0] && allLaps[0].sessionUID);
    const mine = allLaps.filter((l) => l.track.id === session.trackId && l.sessionUID === uid && !l.flags.includes("incomplete") && l.lapTimeMs - refLap.lapTimeMs <= 2000 && l.file !== refLap.file);
    if (mine.length === sessionLapsLoaded && sessionL) return;
    const perLap = [];
    for (const l of mine) {
      const rec = reportCache[l.file] ??= { ...(await (await fetch(`/api/lap?f=${encodeURIComponent(l.file)}`)).json()), file: l.file };
      perLap.push(lapFromRecord(rec).attempts);
    }
    sessionLapsLoaded = mine.length;
    sessionL = perLap.length >= 2 ? sessionLesson(perLap) : null;
    if (sessionL && sessionL.primary && sessionL.primary.finding) lesson = { n: sessionL.primary.n, finding: sessionL.primary.finding, base: sessionL.primary.metricMedian, session: true };
    renderLesson();
  }
  function filterLapList() {
    const mine = allLaps.filter((l) => l.track.id === session.trackId && !l.flags.includes("incomplete"));
    if (listMode === "2s") lapList = mine.filter((l) => l.lapTimeMs - refLap.lapTimeMs <= 2000).sort((a, b) => a.lapTimeMs - b.lapTimeMs);
    else { const uid = session.uid || (mine[0] && mine[0].sessionUID); lapList = mine.filter((l) => l.sessionUID === uid).sort((a, b) => b.lapNum - a.lapNum); }
    renderLapList();
  }
  $("list-2s").onclick = () => { listMode = "2s"; $("list-2s").className = "on"; $("list-session").className = ""; filterLapList(); };
  $("list-session").onclick = () => { listMode = "session"; $("list-2s").className = ""; $("list-session").className = "on"; filterLapList(); };
  // Save what the report computed: per-corner findings, the lesson, the lap time.
  $("save-report").onclick = async () => {
    const lap = shownLap(); if (!lap) return;
    const meta = allLaps.find((l) => l.lapNum === lap.lapNum && (!lap.file || l.file === lap.file)) || {};
    const body = {
      lapFile: lap.file || meta.file, lapNum: lap.lapNum, lapTimeMs: lap.lapTimeMs, bestLapFile: refLap.file, bestLapTimeMs: refLap.lapTimeMs,
      corners: lap.attempts.map((a) => ({ n: a.n, dTimeMs: Math.round(a.dTime), finding: a.finding ? { code: a.finding.code, title: a.finding.title, what: a.finding.what, next: a.finding.next } : null, events: a.ev })),
      lesson: lesson && lesson.n !== null && lesson.finding ? { n: lesson.n, title: lesson.finding.title, next: lesson.finding.next } : null,
    };
    if (!body.lapFile) { $("save-note").textContent = "no lap file yet (lap not written)"; return; }
    const r = await fetch("/api/report", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    $("save-note").textContent = r.ok ? "saved → " + (await r.json()).saved : "save failed";
    setTimeout(() => ($("save-note").textContent = ""), 4000);
  };
  function renderLapList() {
    const el = $("laps-list"), best = refLap ? refLap.lapTimeMs : 0;
    $("laps-count").textContent = `${lapList.length}${listMode === "2s" ? " within 2 s" : " this session"}`;
    el.innerHTML = lapList.map((l, i) => `<div data-f="${l.file}" class="${reportLap && reportLap.file === l.file ? "sel" : ""}"><span class="i">${i + 1}.</span><span class="n">L${l.lapNum}</span><span class="t">${fmtLap(l.lapTimeMs)}</span><span class="${l.lapTimeMs - best > 0 ? "loss" : "gain"}">${l.lapTimeMs - best > 0 ? "+" : ""}${((l.lapTimeMs - best) / 1000).toFixed(3)}</span><span class="when">${(l.recordedAt || "").slice(5, 16).replace("T", " ")}${l.valid ? "" : " ✗"}</span></div>`).join("") || "";
    el.querySelectorAll("div[data-f]").forEach((row) => row.onclick = async () => {
      const f = row.dataset.f;
      const rec = reportCache[f] ??= { ...(await (await fetch(`/api/lap?f=${encodeURIComponent(f)}`)).json()), file: f };
      reportLap = lapFromRecord(rec); pinned = null; manualReport = true; setMode(true); renderReport();
    });
  }
  function renderReport() {
    renderLapList();
    const lap = shownLap();
    $("report-which").textContent = "";
    if (!lap) { $("report-line").textContent = "—"; return; }
    const lastLapSaved = lastLap; const lastLapRef = lap; // the rest of this function reads \`lastLap\`; point it at the shown lap
    lastLap = lastLapRef;
    try { renderReportBody(); } finally { lastLap = lastLapSaved; }
  }
  function renderReportBody() {
    const lt = lastLap.lapTimeMs, best = refLap ? refLap.lapTimeMs : null;
    $("report-line").innerHTML = `lap ${lastLap.lapNum} · <b>${fmtLap(lt)}</b>` + (lt && best ? ` · best ${fmtLap(best)} · <b class="${lt - best > 0 ? "loss" : "gain"}">${lt - best > 0 ? "+" : ""}${((lt - best) / 1000).toFixed(2)}</b>` : "");
    // corner bars: time lost per corner, biggest first; the finding word on each
    const cv = $("corner-bars"), c = cv.getContext("2d"), W = cv.width, H = cv.height;
    c.clearRect(0, 0, W, H);
    const rows = lastLap.attempts.slice().sort((a, b) => b.dTime - a.dTime);
    if (!rows.length) return;
    const max = Math.max(200, ...rows.map((r) => Math.abs(r.dTime))), rowH = Math.min(24, H / Math.max(1, rows.length)), x0 = 44, w = W - x0 - 150;
    c.textBaseline = "middle";
    rows.forEach((r, i) => {
      const y = i * rowH + 3, h = rowH - 6;
      if (pinned === r.n) { c.fillStyle = "#2a2a2a"; c.fillRect(0, y - 3, W, rowH); }
      c.font = "bold 14px monospace"; c.fillStyle = resultColor(r.dTime); c.textAlign = "right"; c.fillText("T" + r.n, x0 - 8, y + h / 2);
      c.fillStyle = "#1c1c1c"; c.fillRect(x0, y, w, h);
      c.fillStyle = resultColor(r.dTime); c.fillRect(x0, y, (Math.abs(r.dTime) / max) * w, h);
      c.fillStyle = "#eee"; c.textAlign = "left"; c.fillText((r.dTime > 0 ? "+" : "") + (r.dTime / 1000).toFixed(2), x0 + w + 8, y + h / 2);
      c.font = "11px monospace"; c.fillStyle = "#aaa"; c.fillText(r.finding ? r.finding.title : "", x0 + w + 62, y + h / 2);
    });
    cv.onclick = (e) => { const r = cv.getBoundingClientRect(), y = (e.clientY - r.top) * cv.height / r.height, row = rows[Math.floor(y / rowH)]; if (row) { pinned = row.n; renderReport(); } };
    const first = rows[0]; if (first) showCorner(pinned ?? first.n);
  }
  function setMode(report) {
    if (report === inReport) return;
    inReport = report;
    document.body.classList.toggle("report", report);
    $("mode-btn").textContent = report ? "BACK TO LIVE" : "LAP REPORT";
    $("mode-btn").className = report ? "on" : "";
    if (report) { renderReport(); loadLapList(); }
  }
  $("mode-btn").onclick = () => { manualReport = !inReport; setMode(manualReport); };

  // ---- socket ----
  const statusEl = $("status");
  function setStatus(cls, text) { statusEl.className = cls; $("status-text").textContent = text; }
  function connect() {
    socket = new WebSocket(`ws://${location.host}`);
    socket.onopen = () => setStatus("waiting", "WAITING");
    socket.onmessage = (ev) => {
      lastPacketAt = Date.now(); setStatus("live", "LIVE");
      const msg = JSON.parse(ev.data);
      switch (msg.type) {
        case "telemetry": lastTelemetry = msg.data; $("mph").textContent = Math.round(msg.data.speed * MPH); $("gear").textContent = msg.data.gear === 0 ? "N" : msg.data.gear === -1 ? "R" : msg.data.gear;
          if (inReport && msg.data.speed > 10) { manualReport = false; reportLap = null; setMode(false); } // driving again: live view, always
          break;
        case "motion": player = msg.data.player; { const c = msg.data.cars && msg.data.cars[player]; if (c) lastPos = { x: c.x, z: c.z }; } break;
        case "lap": lapInfo = msg.data; if (session && session.offline) { session = null; } if (session) onLap(msg.data.player); break;
        case "session": { const changed = !session || session.offline || session.trackId !== msg.data.trackId; const uid = session && session.uid; session = msg.data; session.uid = uid; $("track-name").textContent = `${msg.data.trackName} · ${msg.data.trackLength} m`; if (changed) { loadTrack(msg.data.trackId); loadReference(msg.data.trackId); } break; }
        case "laps": laps = msg.data; if (session && laps[0] && laps[0].file) session.uid = laps[0].file.split("/").slice(-2, -1)[0]; if (session) { loadReference(session.trackId).then(loadLapList); } break;
        case "lapCompleted": laps.push(msg.data); if (lastLap && lastLap.lapNum === msg.data.lapNum) { lastLap.lapTimeMs = msg.data.lapTimeMs; if (inReport) renderReport(); } if (session) { loadReference(session.trackId).then(loadLapList); } break;
      }
    };
    socket.onclose = () => { setStatus("disconnected", "DISCONNECTED"); setTimeout(connect, 1000); };
    socket.onerror = () => socket.close();
  }
  // Mode: the game stops sending packets when paused. No packets for 1.5 s + a finished lap = report.
  setInterval(() => {
    const stale = socket && socket.readyState === WebSocket.OPEN && Date.now() - lastPacketAt > 1500;
    if (stale) { if (!inReport) setStatus("waiting", "PAUSED"); lapInfo = null; if (!shownLap() && !reviewing) reviewFromDisk(); }
    if (!manualReport) setMode(stale && !!shownLap());
  }, 250);
  connect();
  // Packets not flowing (game off, paused, or the page just refreshed) and nothing to show: review
  // mode from disk on the newest recorded lap. The live stream takes over when packets resume.
  let reviewing = false;
  async function reviewFromDisk() {
    if (reviewing) return; reviewing = true;
    try {
      const all = await (await fetch("/api/laps")).json();
      if (!all.length) return;
      const newest = session ? (all.find((l) => l.track.id === session.trackId) || all[0]) : all[0];
      if (!session) {
        session = { trackId: newest.track.id, trackName: newest.track.name, trackLength: newest.track.length, uid: newest.sessionUID, offline: true };
        $("track-name").textContent = `${newest.track.name} · ${newest.track.length} m`;
      }
      if (!session.uid) session.uid = newest.sessionUID;
      setStatus("waiting", "NO GAME · reviewing recorded laps");
      if (!trackRaw) await loadTrack(session.trackId);
      if (!refLap) await loadReference(session.trackId);
      listMode = "session"; $("list-2s").className = ""; $("list-session").className = "on";
      manualReport = true; setMode(true); await loadLapList();
      const first = $("laps-list").querySelector("div[data-f]"); if (first && !shownLap()) first.click();
    } finally { reviewing = false; }
  }
  setTimeout(() => { if (Date.now() - lastPacketAt > 2000 && !shownLap()) reviewFromDisk(); }, 2500);
  (function frame() { drawMap(); requestAnimationFrame(frame); })();
</script>
