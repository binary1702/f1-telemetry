<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 25 Coach</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #eee; font: 15px/1.3 ui-monospace, Menlo, monospace; }
  body { padding: 12px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
  a { color: #888; }
  .hdr { display: flex; align-items: center; gap: 16px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: 0.1em; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #666; margin-right: 6px; }
  .live .dot { background: #2ecc40; } .waiting .dot { background: #f39c12; } .disconnected .dot { background: #e74c3c; }
  button { background: #1a1a1a; color: #eee; border: 1px solid #444; padding: 3px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  button.on { border-color: #2ecc40; color: #2ecc40; }
  .label { font-size: 11px; color: #888; letter-spacing: 0.15em; }
  .top { display: flex; gap: 12px; align-items: stretch; height: 70px; }
  .current-delta { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 0 20px; display: flex; align-items: center; justify-content: center; min-width: 180px; }
  .current-delta .delta { font-size: 48px; font-weight: bold; letter-spacing: -0.02em; }
  .current-delta .delta.flat { color: #555; }
  .gear-display { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; width: 70px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; }
  .loss { color: #e74c3c; } .gain { color: #2ecc40; }
  .plan { font-size: 22px; color: #aaa; margin: 6px 0; white-space: nowrap; text-align: center; }
  .plan .turn { color: #eee; font-weight: bold; margin-right: 12px; }
  .plan b { font-size: 28px; }
  .plan .r { color: #ff3b30; } .plan .w { color: #eee; } .plan .g { color: #2ecc40; } .plan .y { color: #f1c40f; }
  .main { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(0, 1.3fr); gap: 20px; flex: 1; min-height: 0; }
  .main > div { min-height: 0; }
  #live-left, #report { display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1; }
  .right { display: flex; flex-direction: column; min-height: 0; }
  #report { display: none; }
  body.report #report { display: flex; }
  .card { margin-bottom: 0; }
  .card.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .card.grow canvas.fill { flex: 1; min-height: 110px; height: auto !important; }
  .check { display: grid; grid-template-columns: 24px 70px 1fr 1fr; gap: 2px 10px; font-size: 18px; margin-top: 6px; align-items: baseline; max-width: 360px; }
  .check .h { font-size: 11px; color: #888; letter-spacing: 0.15em; }
  .check .ok { color: #2ecc40; } .check .bad { color: #e74c3c; } .check .k { color: #aaa; font-size: 14px; } .check .v { color: #eee; font-weight: bold; } .check .b { color: #888; }
  canvas { display: block; width: 100%; }
  #map { background: #0a0a0a; border: 1px solid #333; flex: 1; min-height: 0; cursor: pointer; }
  .corner-graphs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; flex: 1; min-height: 0; }
  .corner-graph { background: #0a0a0a; border: 1px solid #333; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; min-height: 0; }
  .corner-graph-label { font-size: 11px; color: #888; margin-bottom: 4px; display: flex; align-items: baseline; gap: 6px; }
  .corner-graph-label .t { font-size: 18px; font-weight: bold; color: #eee; }
  .corner-graph-label .delta { font-size: 14px; font-weight: bold; }
  .corner-graph-label .next { color: #f39c12; }
  .brake-dist { font-size: 16px; font-weight: bold; color: #e74c3c; margin-left: auto; }
  .brake-dist.flat { color: #2ecc40; }
  .brake-dist.zone { color: #f39c12; }
  .corner-graph canvas { flex: 1; min-height: 150px; min-width: 0; }
  .corner-graph-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 10px; margin-top: 6px; }
  .corner-graph-stats .stat { display: flex; gap: 4px; }
  .corner-graph-stats .stat-label { color: #666; }
  .corner-graph-stats .stat-value { color: #eee; font-weight: bold; }
  .corner-graph-stats .brake { color: #e74c3c; }
  .corner-graph-stats .trail { color: #f1c40f; }
  .corner-graph-stats .apex { color: #fff; }
  .corner-graph-stats .gas { color: #2ecc40; }
  .corner-list { display: flex; flex-direction: column; gap: 2px; max-height: 300px; overflow-y: auto; }
  .corner-list .corner-item { display: grid; grid-template-columns: 36px 50px 30px 70px 20px; gap: 6px; padding: 4px 8px; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; cursor: pointer; font-size: 11px; align-items: center; }
  .corner-list .corner-item .zones { display: flex; width: 70px; height: 8px; border-radius: 2px; overflow: hidden; background: #333; }
  .corner-list .corner-item .zone-bar { height: 100%; }
  .corner-list .corner-item .zone-brake { background: #e74c3c; }
  .corner-list .corner-item .zone-trail { background: #f1c40f; }
  .corner-list .corner-item .zone-gas { background: #2ecc40; }
  .corner-list .corner-item:hover { background: #252525; border-color: #444; }
  .corner-list .corner-item.focused { background: #2a2a1a; border-color: #f39c12; }
  .corner-list .corner-item.next { border-left: 3px solid #f39c12; }
  .corner-list .corner-item.last { background: #1a2a1a; }
  .corner-list .corner-item.disabled { opacity: 0.4; text-decoration: line-through; }
  .corner-list .corner-item .t { font-weight: bold; color: #eee; }
  .corner-list .corner-item .delta { font-weight: bold; }
  .corner-list .corner-item .speed { color: #666; text-align: right; font-size: 10px; }
  .corner-list .corner-item .x { color: #666; font-size: 9px; text-align: center; }
  .corner-list .corner-item .x:hover { color: #e74c3c; }
  .corner-list .corner-item.disabled .x { color: #2ecc40; }
  #corner-detail { margin-top: 8px; }
  #corner-detail canvas { background: #0a0a0a; border: 1px solid #333; width: 100%; height: 150px; }
  .card.corner { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.2fr); gap: 0 16px; align-items: start; flex: none; }
  .card { border: 1px solid #2a2a2a; border-radius: 8px; padding: 10px 14px; background: #0d0d0d; margin-bottom: 10px; }
  .verdict { font-size: 34px; font-weight: bold; line-height: 1.1; }
  .tip { font-size: 18px; color: #ddd; margin-top: 4px; }
  .lesson { font-size: 22px; line-height: 1.25; }
  .lesson .t { color: #f1c40f; font-weight: bold; }
  .better { color: #2ecc40; } .worse { color: #e74c3c; } .same { color: #aaa; }
  .sub { color: #888; font-size: 13px; }
  body.report #live-right { display: none; }
  .report-line { font-size: 22px; white-space: nowrap; }
  #report { overflow-y: auto; }
  .laps { max-height: 150px; overflow-y: auto; font-size: 14px; margin-top: 4px; }
  .laps div { display: grid; grid-template-columns: 36px 60px 110px 80px 1fr; gap: 10px; padding: 2px 4px; cursor: pointer; border-radius: 4px; }
  .laps .i { color: #666; text-align: right; }
  .laps div:hover { background: #1a1a1a; } .laps div.sel { background: #22301f; }
  .laps .n { color: #888; } .laps .t { font-weight: bold; } .laps .when { color: #666; font-size: 12px; }
  .report-line b { font-size: 30px; }
  /* Full lap times panel */
  .lap-times-panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-left: 1px solid #333; padding-left: 12px; }
  .lap-times-panel .label { font-size: 10px; color: #666; letter-spacing: 0.1em; margin-bottom: 4px; }
  .lap-times-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .lap-times-list .lt-row { display: grid; grid-template-columns: 22px 58px 1fr; gap: 2px; padding: 3px 4px; background: #1a1a1a; border-radius: 2px; font-size: 10px; align-items: center; }
  .lap-times-list .lt-row.best { border: 1px solid #2ecc40; }
  .lap-times-list .lt-row.current { background: #1a2a3a; border: 1px solid #3498db; }
  .lap-times-list .lt-num { color: #666; font-size: 9px; }
  .lap-times-list .lt-time { font-weight: bold; color: #eee; font-size: 11px; }
  .lap-times-list .lt-time.gain { color: #2ecc40; }
  .lap-times-list .lt-delta { font-weight: bold; font-size: 9px; }
  body.report .lap-times-panel { display: none; }
</style>
</head>
<body>
<div class="hdr">
  <h1>F1 25 COACH</h1>
  <span id="status" class="disconnected"><span class="dot"></span><span id="status-text">DISCONNECTED</span></span>
  <span id="track-name" class="sub"></span>
  <span id="ref-note" class="sub"></span>
  <span style="flex:1"></span>
  <button id="mode-btn">LAP REPORT</button>
  <a href="/sessions" style="font-size:12px">sessions</a>
  <a href="/live" style="font-size:12px">live</a>
  <a href="/compare" style="font-size:12px">compare</a>
  <a href="/setups" style="font-size:12px">setups</a>
</div>

<div class="top">
  <div class="gear-display"><span id="gear">N</span></div>
  <div class="current-delta"><span id="live-delta" class="delta flat">--</span></div>
</div>

<div class="main">
  <div id="live-left">
    <div class="card" style="display:flex;flex-direction:column;flex:1;min-height:0;">
      <div style="display:grid;grid-template-columns:1fr 180px;gap:12px;flex:1;min-height:0;overflow:hidden;">
        <div id="corner-list" class="corner-list"></div>
        <div class="lap-times-panel">
          <div class="label">SESSION LAPS</div>
          <div id="lap-stats" style="font-size:10px;color:#888;margin-bottom:6px;line-height:1.4;"></div>
          <div id="lap-times-list" class="lap-times-list"></div>
        </div>
      </div>
      <div id="corner-graphs" class="corner-graphs">
        <div class="corner-graph">
          <div class="corner-graph-label"><span id="last-corner-label">--</span><span id="last-corner-brake" class="brake-dist"></span></div>
<canvas id="last-corner-canvas" width="300" height="200"></canvas>
        </div>
        <div class="corner-graph">
          <div class="corner-graph-label"><span id="next-corner-label">--</span><span id="next-corner-brake" class="brake-dist"></span></div>
<canvas id="next-corner-canvas" width="300" height="200"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="right">
    <canvas id="map"></canvas>
  </div>

  <div id="report">
    <div class="card">
      <div class="label">LAP REPORT · <span id="report-which" class="sub"></span> <button id="save-report" style="margin-left:10px">SAVE REPORT</button> <span id="save-note" class="sub"></span></div>
      <div class="report-line" id="report-line">—</div>
    </div>
    <div class="card">
      <div class="label">LAPS · <span id="laps-count"></span> · <button id="list-2s" class="on">WITHIN 2 s</button> <button id="list-session">THIS SESSION</button></div>
      <div id="laps-list" class="laps"></div>
    </div>
    <div class="card">
      <div class="label">TIME LOST PER CORNER</div>
      <canvas id="corner-bars" width="480" height="240" style="height:240px"></canvas>
    </div>
    <div class="card">
      <div class="label">WORK ON THIS</div>
      <div class="lesson" id="lesson-r">—</div>
      <canvas id="lesson-bar-r" width="480" height="66" style="height:66px;margin-top:6px;display:none"></canvas>
    </div>
  </div>
</div>

<script type="module">
  import { cornerSegments, cornerEntries, cornerMetrics, brakeEvents, coachBraking, progress, pickLesson, metricValue, sessionLesson, hasLine, fitWorld, applyFit, lineOffsets, turnSign, lineMetrics, coachLine, at } from "/analysis.js";

  const $ = (id) => document.getElementById(id);
  const MPH = 0.621371;
  const fmtLap = (ms) => { if (!ms) return "--"; const m = Math.floor(ms / 60000), s = ((ms % 60000) / 1000).toFixed(3).padStart(6, "0"); return `${m}:${s}`; };
  // your rule: purple at −0.10 or better, green for any gain, yellow for any loss up to +0.10, red beyond
  const resultColor = (dTime) => (dTime <= -100 ? "#b57bee" : dTime < 0 ? "#2ecc40" : dTime <= 100 ? "#f1c40f" : "#e74c3c");

  function renderLapHistory() {
    // find live delta
    let curDelta = null;
    for (let i = live.samples.length - 1; i >= 0; i--) {
      if (live.samples[i].dt !== null) { curDelta = live.samples[i].dt; break; }
    }
    // update big delta display
    const deltaEl = $("live-delta");
    if (deltaEl) {
      if (curDelta !== null) {
        const sign = curDelta > 0 ? "+" : "";
        deltaEl.textContent = `${sign}${(curDelta / 1000).toFixed(3)}`;
        deltaEl.className = `delta ${curDelta > 0 ? "loss" : "gain"}`;
      } else {
        deltaEl.textContent = "--";
        deltaEl.className = "delta flat";
      }
    }
  }

  function renderLapTimesPanel() {
    const el = $("lap-times-list");
    const statsEl = $("lap-stats");
    if (!el) return;
    // all laps from this session with valid times
    const allValid = laps.filter(l => l.lapTimeMs && !l.flags?.includes("incomplete"));
    const allTotal = laps.filter(l => l.lapTimeMs); // including incomplete for total count
    const sessionBest = allValid.length ? Math.min(...allValid.map(l => l.lapTimeMs)) : null;
    // stats
    const validPct = allTotal.length > 0 ? Math.round((allValid.length / allTotal.length) * 100) : 0;
    const avgTime = allValid.length > 0 ? allValid.reduce((sum, l) => sum + l.lapTimeMs, 0) / allValid.length : null;
    const totalLaps = laps.length;
    if (statsEl) {
      let stats = `<span style="color:#eee">${allValid.length}</span>/${totalLaps} · <span style="color:${validPct >= 80 ? "#2ecc40" : validPct >= 50 ? "#f1c40f" : "#e74c3c"}">${validPct}%</span>`;
      if (avgTime) stats += `<br><span style="color:#f1c40f;font-weight:bold">avg ${fmtLap(avgTime)}</span>`;
      if (sessionBest) stats += `<br><span style="color:#2ecc40;font-weight:bold">best ${fmtLap(sessionBest)}</span>`;
      statsEl.innerHTML = stats;
    }
    // lap list - newest first, show all
    const sortedLaps = [...allValid].reverse();
    let html = "";
    for (const lap of sortedLaps) {
      const delta = sessionBest ? lap.lapTimeMs - sessionBest : 0;
      const deltaStr = delta === 0 ? "BEST" : `+${(delta / 1000).toFixed(2)}`;
      const isSessionBest = sessionBest && lap.lapTimeMs === sessionBest;
      const isCurrent = lap.lapNum === live.lapNum;
      html += `<div class="lt-row${isSessionBest ? " best" : ""}${isCurrent ? " current" : ""}">`;
      html += `<span class="lt-num">L${lap.lapNum}</span>`;
      html += `<span class="lt-time${isSessionBest ? " gain" : ""}">${fmtLap(lap.lapTimeMs)}</span>`;
      html += `<span class="lt-delta ${isSessionBest ? "gain" : "loss"}">${isSessionBest ? "BEST" : deltaStr}</span>`;
      html += `</div>`;
    }
    el.innerHTML = html || '<div style="color:#666;font-size:10px;">No laps yet</div>';
  }

  // ---- state ----
  let session = null, lapInfo = null, lastTelemetry = null, laps = [], player = 0, lastPacketAt = 0, socket = null;
  let trackRaw = null, track = null;
  let refLap = null, refSegs = [], refCorners = [], refEvents = [], refEntries = [];
  // Brake distance the way the boards count it: to where the corner starts bending. If the brake
  // point is already inside the bend (linked corners), count to the apex and say so.
  function brakeDist(ev) { return ev && ev.braking ? { m: ev.apexD - ev.brakeStartD, to: "apex" } : null; }
  let live = fresh(-1), history = {}, lesson = null, lastLap = null;
  let manualReport = false, inReport = false, pinned = null, seqFor = null, nextIdx = -1;
  let disabledCorners = new Set(JSON.parse(localStorage.getItem("disabledCorners") || "[]")); // corners to skip in coaching
  let focusedCorner = null; // corner focused to show detail view
  let currentLapD = null; // current lap distance for live car position
  let reportLap = null, lapList = [], reportCache = {}, listMode = "2s", allLaps = []; // a past lap chosen in the report; the laps list and its filter
  let sessionL = null, sessionLapsLoaded = 0; // the session lesson: computed over every recorded lap of this session within 2 s
  // Racing line: the quickest recorded lap that carries car positions is the line reference; its
  // positions fit the game's world onto the outline (worldFit) for every lap after it.
  let lastPos = null, lineRef = null, worldFit = null, lineRefOff = null, lineRefM = [], turnSigns = [];
  const shownLap = () => reportLap || lastLap;
  const refCache = {};
  function fresh(lapNum) { return { lapNum, armed: false, beforeLine: false, samples: [], log: [], attempts: [], cur: null, exited: false, gasM: 0 }; }

  // ---- data ----
  let geo = null; // rotated outline in track units: pts, cum, total
  async function loadTrack(id) {
    const r = await fetch(`/tracks/${id}.json`);
    trackRaw = r.ok ? await r.json() : null;
    if (trackRaw) { buildGeo(); fitTrack(); buildCoach(); }
  }
  function buildGeo() {
    const raw = trackRaw, rad = (raw.rotation || 0) * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
    const pts = raw.x.map((x, i) => [x * cos - raw.y[i] * sin, -(x * sin + raw.y[i] * cos)]);
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const total = cum[cum.length - 1] + Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]);
    geo = { pts, cum, total };
  }
  // point on the rotated outline at lap fraction f
  function geoAt(f) {
    const d = ((f % 1) + 1) % 1 * geo.total;
    let lo = 0, hi = geo.cum.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (geo.cum[mid] <= d) lo = mid; else hi = mid - 1; }
    const a = geo.pts[lo], b = geo.pts[(lo + 1) % geo.pts.length];
    const segLen = (lo + 1 < geo.cum.length ? geo.cum[lo + 1] : geo.total) - geo.cum[lo];
    const t = segLen > 0 ? (d - geo.cum[lo]) / segLen : 0;
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }
  async function loadReference(id) {
    const r = await fetch(`/api/reference?track=${id}&validOnly=0`);
    if (!r.ok) { refLap = null; $("ref-note").textContent = "no best lap yet"; return; }
    const best = await r.json();
    if (refLap && refLap.file === best.file) return;
    if (refLap) { live = fresh(live.lapNum); history = {}; lesson = null; renderLesson(); }
    refLap = refCache[best.file] ??= { ...(await (await fetch(`/api/lap?f=${encodeURIComponent(best.file)}`)).json()), file: best.file };
    $("ref-note").textContent = `best ${fmtLap(best.lapTimeMs)} · L${best.lapNum}`;
    buildCoach();
  }
  function buildCoach() {
    if (!refLap || !trackRaw) return;
    refSegs = cornerSegments(trackRaw, refLap.track.length);
    refCorners = refSegs.map((seg) => ({ seg, m: cornerMetrics(refLap.grid, seg) }));
    refEvents = refSegs.map((seg) => brakeEvents(refLap.grid, seg));
    refEntries = cornerEntries(trackRaw, refSegs, refLap.track.length);
    seqFor = null;
    renderCornerList();
  }
  function isCornerEnabled(n) { return !disabledCorners.has(n); }
  let lastCompletedCorner = null;
  function renderCornerList() {
    const container = $("corner-list");
    if (!refSegs.length) { container.innerHTML = ""; $("corner-detail").style.display = "none"; return; }
    const nextN = refCorners[nextIdx] ? refCorners[nextIdx].seg.n : null;
    container.innerHTML = refSegs.map((seg, i) => {
      const ev = refEvents[i];
      const isDisabled = disabledCorners.has(seg.n);
      const isFocused = focusedCorner === seg.n;
      const isNext = seg.n === nextN && !inReport && isCornerEnabled(seg.n);
      const isLast = seg.n === lastCompletedCorner && !inReport;
      const lastAttempt = (history[seg.n] || []).slice(-1)[0];
      const delta = lastAttempt ? lastAttempt.dTime : null;
      const deltaStr = delta !== null ? `${delta > 0 ? "+" : ""}${(delta / 1000).toFixed(3)}` : "";
      const deltaColor = delta !== null ? (delta > 0 ? "#e74c3c" : "#2ecc40") : "#666";
      // calculate zone percentages from reference events
      let zones = "";
      if (ev && ev.braking) {
        const total = seg.d1 - seg.d0;
        const brakeLen = ev.apexD - ev.brakeStartD;
        const trailLen = ev.overlapM || 0;
        const gasLen = ev.pickupD !== null ? (seg.d1 - ev.pickupD) : (seg.d1 - ev.apexD);
        const brakePct = Math.round((brakeLen / total) * 100);
        const trailPct = Math.round((trailLen / total) * 100);
        const gasPct = Math.round((gasLen / total) * 100);
        zones = `<span class="zones"><span class="zone-bar zone-brake" style="width:${brakePct}%"></span><span class="zone-bar zone-trail" style="width:${trailPct}%"></span><span class="zone-bar zone-gas" style="width:${gasPct}%"></span></span>`;
      } else {
        zones = `<span class="zones"><span class="zone-bar zone-gas" style="width:100%"></span></span>`;
      }
      return `<div class="corner-item${isDisabled ? " disabled" : ""}${isFocused ? " focused" : ""}${isNext ? " next" : ""}${isLast ? " last" : ""}" data-n="${seg.n}">
        <span class="t">T${seg.n}</span>
        <span class="delta" style="color:${deltaColor}">${deltaStr}</span>
        <span class="speed">${ev ? Math.round(ev.minSpeed * MPH) : ""}</span>
        ${zones}
        <span class="x" data-toggle="${seg.n}">${isDisabled ? "+" : "×"}</span>
      </div>`;
    }).join("");
    container.querySelectorAll(".corner-item").forEach((el) => {
      el.onclick = (e) => {
        // handle toggle button click
        if (e.target.classList.contains("x")) {
          const n = parseInt(e.target.dataset.toggle);

  // ---- panels ----

  // Four ticks: brake point, brake while turning, apex speed, gas. Each with you vs best.
  let checklistLine = null;
  function checklist(ev, ref, i) {

    const out = [`<span></span><span></span><span class="h">YOU</span><span class="h">BEST</span>`];

  // corner display - now just updates the corner list highlight
  function showCorner(n) {
    // corner list handles display now
  }
  let lastLessonAttempt = null;
  function renderLesson(attempt) {

    const inc = sessionL && sessionL.inconsistent && sessionL.inconsistent.n !== lesson.n
      ? `<br><span style="font-size:15px"><span class="t" style="color:#e67e22">T${sessionL.inconsistent.n} · INCONSISTENT</span> <span class="sub">${(sessionL.inconsistent.p10 / 1000).toFixed(2)} to +${(sessionL.inconsistent.p90 / 1000).toFixed(2)} s · same brake point every lap</span></span>`
      : sessionL && sessionL.inconsistent && sessionL.inconsistent.n === lesson.n ? `<br><span class="sub" style="color:#e67e22">also swings ${(sessionL.inconsistent.p10 / 1000).toFixed(2)} to +${(sessionL.inconsistent.p90 / 1000).toFixed(2)} s lap to lap</span>` : "";

    bars(cv, [[lesson.session ? "typical" : "was", lesson.base, "#7a6a2a"], ["now", now ?? lesson.base, "#f1c40f"], ["best", lesson.finding.metric.ref, "#888"]]);
  }
  // A recorded lap turned into the same shape as a live lap, judged corner by corner against the reference.
  function lapFromRecord(rec) {
    const g = rec.grid;
    const samples = g.d.map((d, i) => { const tr = at(refLap.grid, "t", d); return { d, t: g.t[i], dt: tr === null ? null : g.t[i] - tr, speed: g.speed[i], throttle: g.throttle[i], brake: g.brake[i], steer: g.steer[i] }; });

  function filterLapList() {

  $("list-2s").onclick = () => { listMode = "2s"; $("list-2s").className = "on"; $("list-session").className = ""; filterLapList(); };

  function renderReport() {

  // ---- socket ----
  const statusEl = $("status");
  function setStatus(cls, text) { statusEl.className = cls; $("status-text").textContent = text; }

    console.log("[WS] connecting to", `ws://${location.host}`);
